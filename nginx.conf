# Atlas Pré-Data — servidor do PWA.
#
# Expandido na subida do contêiner a partir de /etc/nginx/templates, então
# ${ATLAS_API} vira o endereço real sem precisar de rebuild.

server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    # Foto de celular tem 2-5 MB e sobe por aqui. O padrão do nginx é 1 MB, e
    # com ele o envio falharia com 413 justamente nas fotos que interessam —
    # as grandes, tiradas de perto.
    client_max_body_size 25m;

    # Subir foto em wi-fi fraco de marina demora. Sem estes prazos o nginx
    # corta a conexão no meio do upload e o colaborador vê "erro ao enviar"
    # sem ter feito nada errado.
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- O service worker NÃO pode ficar em cache ----
    #
    # É ele que decide o que o app mostra offline. Servido com cache, o
    # navegador segue usando o sw antigo por horas ou dias: o colaborador
    # atualiza o app, o shell velho continua sendo entregue, e a correção que
    # acabou de subir simplesmente não chega ao píer. É a mesma armadilha que
    # custou uma rodada de "nada mudou" em desenvolvimento.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Os assets têm hash no nome, então podem durar para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- API: caminho relativo por proxy ----
    #
    # Mantém o app e o backend na MESMA ORIGEM do ponto de vista do navegador.
    # Sem isto seria preciso gravar a URL do Atlas no bundle e abrir CORS —
    # dois lugares a mais para errar, e um endereço de servidor exposto no
    # código que roda no celular de terceiros.
    location /api/ {
        # RESOLUCAO EM TEMPO DE REQUISICAO, nao na subida.
        #
        # Com o endereco escrito direto no proxy_pass, o nginx resolve o DNS ao
        # iniciar e RECUSA A SUBIR se nao encontrar o host — foi o que aconteceu
        # no primeiro deploy: `host not found in upstream`, e o contêiner em
        # loop de reinicio. Um PWA offline-first que nao abre porque a API
        # sumiu e o oposto do que ele promete.
        #
        # Passando por uma VARIAVEL, o nginx adia a resolucao para cada
        # requisicao: o app sobe e serve normalmente, e so a chamada de API
        # falha enquanto o backend estiver fora — que e exatamente o caso que a
        # tela ja sabe tratar ("sem conexao, fica guardado").
        #
        # O resolver vem do proprio entrypoint da imagem (15-local-resolvers),
        # que le o /etc/resolv.conf do contêiner — sem chumbar 127.0.0.11, que
        # so vale em rede Docker padrao.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $atlas ${ATLAS_API};

        # Com variavel, o nginx NAO acrescenta o caminho sozinho: sem o
        # $request_uri toda chamada chegaria na raiz do backend.
        proxy_pass $atlas$request_uri;
        proxy_http_version 1.1;

        # `$proxy_host` e nao `$host`: o cabecalho precisa ser o do DESTINO.
        # Assim o mesmo arquivo serve para as duas formas de apontar o
        # ATLAS_API — o nome interno do servico no EasyPanel
        # (http://atlas:8080) ou a URL publica (https://yachtsatlas.online).
        # Com o host da origem, um destino HTTPS atras de proxy reverso
        # devolveria o site errado ou um 404 de rota desconhecida.
        proxy_set_header Host              $proxy_host;

        # Necessario quando o ATLAS_API e https: sem SNI, o servidor do outro
        # lado nao sabe qual certificado apresentar e o handshake falha.
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O upload de foto é um POST grande e demorado: sem buffering o nginx
        # repassa em fluxo, em vez de guardar o arquivo inteiro em disco antes
        # de mandar adiante.
        proxy_request_buffering off;
    }

    # ---- SPA ----
    #
    # O app tem rotas próprias (/entrar, /barco/YA-IATE-...). Quem abre uma
    # delas direto — ou volta pelo ícone da tela de início — precisa receber o
    # index, não um 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A página de conferência de telas é ferramenta de desenvolvimento e não
    # tem por que existir em produção.
    location = /telas.html {
        return 404;
    }
}
